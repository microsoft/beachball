name: Release

# Release on manual trigger only
on:
  workflow_dispatch:

env:
  nodeVersion: 24
  npmVersion: 11

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # This environment contains secrets needed for publishing
    environment: release

    permissions:
      # for trusted publishing
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Don't save creds in the git config (so it's easier to override later)
          persist-credentials: false

      - name: Install Node.js ${{ env.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.nodeVersion }}

      - name: Install npm@${{ env.npmVersion }}
        run: npm install --global npm@${{ env.npmVersion }}

      - run: yarn --immutable

      - run: yarn build --verbose

      - run: yarn test --verbose

      # TODO (release): switch back to regular release
      # (temporarily add yarn release:canary when ready)
      - name: Publish packages (non-prerelease)
        run: |
          git config user.email "257645319+office-ogx-auth-helper[bot]@users.noreply.github.com"
          git config user.name "OGX bot"
          yarn release:others
        env:
          BEACHBALL_GIT_TOKEN: ${{ secrets.REPO_PAT }}
