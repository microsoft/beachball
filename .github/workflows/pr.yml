name: PR

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

concurrency:
  # For PRs, use the ref (branch) in the concurrency group so that new pushes cancel any old runs.
  # For pushes to v2, ideally we wouldn't set a concurrency group, but github actions doesn't
  # support conditional blocks of settings, so we use the SHA so the "group" is unique.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/v2' && github.sha || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    strategy:
      # Sometimes it can be helpful to see if a failure is specific to a particular environment
      fail-fast: false
      matrix:
        include:
          # node 18/npm 6 on ubuntu only (previously this was mainly to test real npm registry operations,
          # but the verdaccio dev dep was removed)
          - os: ubuntu-latest
            npm: 6
            node: 18
          # node 18/npm 8 on ubuntu and windows
          - os: ubuntu-latest
            npm: 8
            node: 18
          - os: windows-latest
            npm: 8
            node: 18
          # node 22/npm 11 on ubuntu and windows
          # (22 would be broken with the old version of verdaccio, but that's been removed)
          - os: ubuntu-latest
            npm: 11
            node: 22
          - os: windows-latest
            npm: 11
            node: 22

    name: build (${{ matrix.os }}, node ${{ matrix.node }}, npm ${{ matrix.npm }})

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      # Guarantee a predictable version of npm for the first round of tests
      - name: Install npm@${{ matrix.npm }}
        run: npm install --global npm@${{ matrix.npm }}

      - run: yarn --immutable

      - run: yarn build --verbose

      - run: yarn checkchange --verbose

      - run: yarn format:check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.npm == 8

      - run: yarn lint --verbose
        if: matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.npm == 8

      - run: yarn test --verbose
        id: test

      # See packageManager.ts comments...
      - name: run specific tests in Windows bash
        if: matrix.os == 'windows-latest'
        shell: bash
        run: yarn workspace beachball test packagePublish npmAuthEnvPassthrough

      # For a few specific test failures, it can be helpful to see npm debug logs
      # (usually not relevant, but there's not a good way to distinguish by specific failure)
      - name: (on test failure) Get npm cache path
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: echo "NPM_CACHE_DIR=$(npm config get cache)" >> "$GITHUB_ENV"

      - name: (on test failure) Upload npm logs as artifact
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-logs-${{ matrix.os }}-node${{ matrix.node }}-npm${{ matrix.npm }}
          path: ${{ env.NPM_CACHE_DIR }}/_logs
          retention-days: 3

      - name: Install Node.js 22
        if: matrix.node != 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # v3 will be used for the publish step, so verify it works in the PR build.
      - name: Check change (beachball v3)
        run: yarn beachball:v3 check --verbose
